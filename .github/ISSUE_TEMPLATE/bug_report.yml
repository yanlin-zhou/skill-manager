name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App version, operating system and Node.js version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Use a minimal sample Skill; exclude personal files and credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
